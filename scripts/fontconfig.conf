<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
  <config></config>
  <match target="pattern"><test name="family" qual="any"><string>sans-serif</string></test><edit name="family" mode="assign" binding="same"><string>Heebo</string></edit></match>
  <match target="pattern"><test name="family" qual="any"><string>serif</string></test><edit name="family" mode="assign" binding="same"><string>Frank Ruhl Libre</string></edit></match>
</fontconfig>
